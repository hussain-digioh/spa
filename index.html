<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digioh SPA QA</title>
    <!-- START Digioh Low Impact Javascript -->
    <script async type="text/javascript" src="https://www.lightboxcdn.com/vendor/0670ec52-609f-4fd1-9f56-f197f6d55993/lightbox_speed.js"></script>
    <!-- END Digioh Low Impact Javascript -->
  </head>
  <body>
    <div id="app"></div>

    <!--
      Digioh universal merge tag lives here as static HTML so it is present
      in the DOM immediately — before Vue mounts and before the async Digioh
      script finishes loading, eliminating any race condition.
      CSS flex order places it after the Vue-rendered nav (order 1) and
      before the main content (order 3).
    -->
    <div id="digioh-host">
      <div
        class="digioh_universal_smart_tag"
        id="digioh-form"
        style="text-align: center;"
      >
        <div
          class="box_loading_placeholder"
          style="position: relative; text-align: center; border-style: none; border-width: 0px; background-color: #fff; height: 750px; width: 100%;"
        >
          <div
            class="box_loading_placeholder_overlay"
            style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.25);"
          ></div>
          <div style="position: relative; top: 50%; transform: translateY(-50%);">
            <img
              class="box_loading_placeholder_image"
              src="https://www.lightboxcdn.com/static/Digioh_Loading_Spinner_Black.gif"
              style="margin: 0 auto; max-height: 100%; max-width: 100%; width: 125px;"
              alt="Loading..."
            />
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
